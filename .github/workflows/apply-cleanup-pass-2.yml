name: Apply Third Eye Cleanup Pass 2

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup-smoke-test
    paths:
      - scripts/cleanup-pass-2.js
      - .github/workflows/apply-cleanup-pass-2.yml

permissions:
  contents: write

jobs:
  apply-cleanup-pass-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-smoke-test

      - name: Apply cleanup pass 2
        run: node scripts/cleanup-pass-2.js

      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drawGPSMarker();' index.html
          grep -q 'updateCoinBtn();' index.html
          grep -q "clear-pins-btn').style.display='none'" index.html

      - name: Commit repaired index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply Third Eye cleanup pass 2'
          git push origin HEAD:cleanup-smoke-test
