name: Apply Third Eye Cleanup Pass 3

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup-smoke-test
    paths:
      - scripts/cleanup-pass-3.js
      - .github/workflows/apply-cleanup-pass-3.yml

permissions:
  contents: write

jobs:
  apply-cleanup-pass-3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-smoke-test

      - name: Apply cleanup pass 3
        run: node scripts/cleanup-pass-3.js

      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="hud-wind-tab"' index.html
          grep -q 'id="hud-switch-tab"' index.html
          grep -q 'aria-label="Drop ball marker"' index.html
          grep -q '10¢' index.html

      - name: Commit repaired index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply Third Eye cleanup pass 3'
          git push origin HEAD:cleanup-smoke-test
