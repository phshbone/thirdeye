name: Smoke Test Action

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup-smoke-test
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://phshbone.github.io/thirdeye/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact cleanup preview
        if: github.ref_name == 'cleanup-smoke-test'
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/third-eye-preview.log 2>&1 &
          echo $! > /tmp/third-eye-preview.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              echo 'Exact cleanup checkout is live on local preview.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/third-eye-preview.log || true
          exit 1

      - name: Verify exact production deployment
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          deadline=$((SECONDS + 300))
          while true; do
            tmp="$(mktemp)"
            rev="${GITHUB_SHA}-${RANDOM}"
            if curl --fail --silent --show-error \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "${base}/index.html?live-smoke-rev=${rev}" -o "$tmp" \
                && cmp -s index.html "$tmp"; then
              rm -f "$tmp"
              echo 'Exact deployed index.html verified.'
              break
            fi
            rm -f "$tmp"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Timed out waiting for deployed index.html to match checkout.'
              exit 1
            fi
            sleep 10
          done

      - name: Run browser smoke test on cleanup preview
        if: github.ref_name == 'cleanup-smoke-test'
        env:
          LIVE_SMOKE_URL: http://127.0.0.1:4173/
        run: npm run test:live-smoke

      - name: Run Live Smoke Test on deployed production
        if: github.ref_name == 'main'
        env:
          LIVE_SMOKE_URL: https://phshbone.github.io/thirdeye/
        run: npm run test:live-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
